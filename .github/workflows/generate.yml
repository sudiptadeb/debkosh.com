name: Generate static output

# Builds the static site and commits .output/public back into the repo
# for quick local viewing. Deployment is handled separately by Cloudflare
# Workers Builds (see wrangler.toml) — this workflow does NOT deploy.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping runs racing to commit the generated output.
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .output/public
          if git diff --cached --quiet; then
            echo "No changes in generated output."
          else
            git commit -m "chore: regenerate static output [skip ci]"
            git push
          fi
